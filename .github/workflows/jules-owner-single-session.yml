name: Google Jules Owner-Only Single-Session Issue & PR Agent

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to analyze or continue in the same Jules session"
        required: true
        type: string
      prompt:
        description: "Instruction or reply for Google Jules"
        required: true
        default: "Analyze this issue, ask me if anything is ambiguous, or propose a concrete execution plan."

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CI: 1
  JULES_API_BASE: "https://jules.googleapis.com/v1alpha"

jobs:
  jules-single-session-agent:
    name: "Google Jules Single-Session Agent (Slash Command /jules)"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # ORGANIZATION-SAFE OWNER LOCK + SLASH COMMAND TRIGGER (/jules, !jules, or fallback @jules)
    if: >
      github.actor != 'github-actions[bot]' &&
      !endsWith(github.actor, '[bot]') &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'issues' &&
          contains(fromJSON('["OWNER", "MEMBER"]'), github.event.issue.author_association) &&
          (
            (github.event.action == 'labeled' && github.event.label.name == 'jules') ||
            contains(github.event.issue.body, '/jules') ||
            contains(github.event.issue.body, '!jules') ||
            contains(github.event.issue.body, '@jules')
          )
        ) ||
        (
          github.event_name == 'issue_comment' &&
          contains(fromJSON('["OWNER", "MEMBER"]'), github.event.comment.author_association) &&
          (
            contains(github.event.comment.body, '/jules') ||
            contains(github.event.comment.body, '!jules') ||
            contains(github.event.comment.body, '@jules')
          )
        )
      )
    concurrency:
      group: jules-single-session-issue-${{ github.event.issue.number || github.event.inputs.issue_number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Verify "/jules" Command, Sanitize Accidental "@jules" Mentions & Harvest Context to /tmp
        id: harvest
        uses: actions/github-script@v9
        env:
          INPUT_ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
          INPUT_PROMPT: ${{ github.event.inputs.prompt }}
        with:
          script: |
            const fs = require('fs');

            // 1. Strict Command Boundary Check: Ignore URLs like "https://jules.google.com"
            if (context.eventName === 'issue_comment') {
              const rawBody = context.payload.comment.body || '';
              const withoutUrls = rawBody.replace(/https?:\/\/\S+/gi, '');
              const cmdRegex = /(?:^|\s|`)([\/!@]jules)\b/i;

              if (!cmdRegex.test(withoutUrls)) {
                core.info('No standalone /jules, !jules, or @jules command found outside URLs. Skipping.');
                core.setOutput('should_run', 'false');
                return;
              }

              // 2. Auto-Sanitizer: Rewrite accidental raw "@jules" to "`/jules`"
              if (/(?:^|\s)@jules\b/i.test(withoutUrls)) {
                try {
                  const sanitizedBody = rawBody.replace(/(^|\s)@jules\b/gi, '$1`/jules`');
                  await github.rest.issues.updateComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: context.payload.comment.id,
                    body: sanitizedBody
                  });
                } catch (editErr) {
                  core.info(`Note: Could not auto-sanitize @jules in comment: ${editErr.message}`);
                }
              }

              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: 'rocket'
              });
            }

            core.setOutput('should_run', 'true');

            const issueNumber = context.payload.issue
              ? context.payload.issue.number
              : parseInt(process.env.INPUT_ISSUE_NUMBER, 10);

            const issueResp = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });

            const commentsResp = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100
            });

            let existingSessionName = '';
            let lastActivityCursor = 0;
            const sessionRegex = /<!--\s*jules-session-id:\s*(sessions\/[a-zA-Z0-9_-]+)\s*-->/;
            const cursorRegex = /<!--\s*jules-activity-cursor:\s*(\d+)\s*-->/;

            for (const c of commentsResp.data) {
              const body = c.body || '';
              const sMatch = body.match(sessionRegex);
              if (sMatch && sMatch[1]) {
                existingSessionName = sMatch[1];
              }
              const cMatch = body.match(cursorRegex);
              if (cMatch && cMatch[1]) {
                lastActivityCursor = parseInt(cMatch[1], 10);
              }
            }

            const formattedComments = commentsResp.data.map((c, idx) => {
              return `[Comment #${idx + 1} by${c.user.login} (${c.html_url})]:\n${c.body}`;
            }).join('\n\n---\n\n');

            const rawInstruction = context.payload.comment
              ? context.payload.comment.body
              : (process.env.INPUT_PROMPT || issueResp.data.body || 'Analyze this issue.');

            const cleanedReply = rawInstruction
              .replace(/`?[\/!@]jules`?\b/gi, '')
              .trim() || rawInstruction;

            const contextBundle = {
              owner: context.repo.owner,
              actor: context.actor,
              issue_author: issueResp.data.user ? issueResp.data.user.login : context.actor,
              repo: context.repo.repo,
              repo_full_name: `${context.repo.owner}/${context.repo.repo}`,
              repo_url: `https://github.com/${context.repo.owner}/${context.repo.repo}`,
              issue_number: issueNumber,
              issue_title: issueResp.data.title,
              issue_body: issueResp.data.body || '',
              issue_url: issueResp.data.html_url,
              trigger_comment_url: context.payload.comment ? context.payload.comment.html_url : issueResp.data.html_url,
              existing_session_name: existingSessionName,
              last_activity_cursor: lastActivityCursor,
              raw_instruction: rawInstruction,
              cleaned_reply: cleanedReply,
              comment_thread: formattedComments
            };

            // Store in /tmp so actions/checkout@v6 never wipes the context file!
            fs.writeFileSync('/tmp/jules_issue_context.json', JSON.stringify(contextBundle, null, 2));

      - name: Checkout repository on Node 24
        if: steps.harvest.outputs.should_run == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 20

      - name: Setup Rust nightly toolchain and components
        if: steps.harvest.outputs.should_run == 'true'
        shell: bash
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly
          rustup component add rust-src llvm-tools-preview rustfmt clippy
          rustup target add x86_64-unknown-none

      - name: Restore Cargo cache on Node 24
        if: steps.harvest.outputs.should_run == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rustos-cargo-v5-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            rustos-cargo-v5-

      - name: Run Pre-Analysis Workspace Diagnostics for Jules Context
        if: steps.harvest.outputs.should_run == 'true'
        shell: bash
        run: |
          cargo clippy --workspace -- -D warnings > /tmp/jules_clippy.log 2>&1 || true
          git log -5 --oneline > /tmp/jules_git_log.txt 2>&1 || true

      - name: Send Initial Task or Forward Owner Reply to Active Jules Session
        if: steps.harvest.outputs.should_run == 'true'
        shell: bash
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          python3 - << 'EOF'
          import json, os, re, sys, time, urllib.request, urllib.error

          API_KEY = os.environ.get("JULES_API_KEY", "").strip()
          API_BASE = os.environ.get("JULES_API_BASE", "https://jules.googleapis.com/v1alpha")
          DEFAULT_BRANCH = os.environ.get("DEFAULT_BRANCH", "main")

          ctx_path = "/tmp/jules_issue_context.json"
          if not os.path.exists(ctx_path):
              print("Error: /tmp/jules_issue_context.json missing.")
              sys.exit(1)

          with open(ctx_path, "r", encoding="utf-8") as f:
              ctx = json.load(f)

          ping_user = ctx.get("actor") or ctx.get("issue_author") or ctx.get("owner")

          if not API_KEY:
              with open("/tmp/jules_reply.json", "w", encoding="utf-8") as f:
                  json.dump({
                      "session_name": "",
                      "session_url": "https://jules.google.com",
                      "mode": "Secret Visibility Check Needed",
                      "state": "MISSING_KEY",
                      "needs_user_reply": True,
                      "ping_user": ping_user,
                      "question_text": "Organization Secret `JULES_API_KEY` was not passed to this runner.",
                      "activity_cursor": 0,
                      "pr_url": "",
                      "issue_url": ctx["issue_url"],
                      "trigger_comment_url": ctx["trigger_comment_url"],
                      "analysis_markdown": (
                          "⚠️ **Action Required:** Please verify in `Organization Settings -> Secrets -> Actions` "
                          "that `RustOS` is checked in the repository access list for `JULES_API_KEY`."
                      )
                  }, f, indent=2)
              sys.exit(0)

          clippy_out = ""
          if os.path.exists("/tmp/jules_clippy.log"):
              with open("/tmp/jules_clippy.log", "r", encoding="utf-8", errors="replace") as f:
                  clippy_out = f.read()[-1000:]

          git_log = ""
          if os.path.exists("/tmp/jules_git_log.txt"):
              with open("/tmp/jules_git_log.txt", "r", encoding="utf-8", errors="replace") as f:
                  git_log = f.read()

          agents_md = ""
          if os.path.exists(".agents/AGENTS.md"):
              with open(".agents/AGENTS.md", "r", encoding="utf-8", errors="replace") as f:
                  agents_md = f.read()[:1200]

          def jules_request(method, path, payload=None):
              url = f"{API_BASE}/{path.lstrip('/')}"
              data = json.dumps(payload).encode("utf-8") if payload is not None else (b"{}" if method == "POST" else None)
              headers = {
                  "X-Goog-Api-Key": API_KEY,
                  "Content-Type": "application/json"
              }
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=60) as resp:
                  raw = resp.read().decode("utf-8")
                  return json.loads(raw) if raw.strip() else {}

          def sanitize_outbound_mentions(text):
              return re.sub(r'(?<![`\w])@([a-zA-Z0-9_-]+)', r'`@\1`', text)

          issue_num = ctx["issue_number"]
          session_title_tag = f"[RustOS Issue #{issue_num}]"
          session_name = ctx.get("existing_session_name", "").strip()
          prev_cursor = int(ctx.get("last_activity_cursor", 0))

          if not session_name:
              try:
                  sessions_list = jules_request("GET", "sessions?pageSize=50").get("sessions", [])
                  for s in sessions_list:
                      if session_title_tag in (s.get("title") or ""):
                          session_name = s.get("name", "")
                          break
              except Exception as e:
                  print(f"Session list lookup note: {e}")

          session_obj = {}
          mode_used = ""

          # CASE A: EXISTING SESSION -> Forward Owner's Direct Reply via :sendMessage
          if session_name:
              try:
                  current_session = jules_request("GET", session_name)
                  curr_state = current_session.get("state", "")
                  prev_acts = jules_request("GET", f"{session_name}/activities?pageSize=50").get("activities", [])
                  prev_cursor = max(prev_cursor, len(prev_acts))

                  if curr_state == "AWAITING_PLAN_APPROVAL":
                      try:
                          jules_request("POST", f"{session_name}:approvePlan", {})
                      except Exception:
                          pass

                  reply_prompt = (
                      f"Owner {ping_user} replied in GitHub Issue #{issue_num} ({ctx['trigger_comment_url']}):\n\n"
                      f"\"{ctx['cleaned_reply']}\"\n\n"
                      f"### Updated Workspace Context\n"
                      f"- Issue Link: {ctx['issue_url']}\n"
                      f"- Latest Clippy Diagnostics:\n{clippy_out}\n\n"
                      f"Please process this reply directly in our ongoing session. "
                      f"All responses, plans, and pull requests MUST be in English. "
                      f"If you have any further clarifying question, state it clearly; otherwise proceed with the implementation and tests."
                  )
                  jules_request("POST", f"{session_name}:sendMessage", {"prompt": reply_prompt})
                  mode_used = f"Forwarded Owner Reply to Active Session (`{session_name}` via `:sendMessage`)"
                  session_obj = jules_request("GET", session_name)
              except Exception as err:
                  print(f"sendMessage on {session_name} failed ({err}), creating fresh session...")
                  session_name = ""
                  prev_cursor = 0

          # CASE B: FIRST CALL ON THIS ISSUE -> Create Primary Session
          if not session_name:
              initial_prompt = (
                  f"All responses, questions, plans, code comments, and pull requests MUST be 100% in English.\n\n"
                  f"### GitHub Context & Direct Links\n"
                  f"- Repository Link: {ctx['repo_url']}\n"
                  f"- Issue / PR Link: {ctx['issue_url']} ({session_title_tag}: {ctx['issue_title']})\n"
                  f"- Triggering Comment Link: {ctx['trigger_comment_url']}\n\n"
                  f"### Owner Instruction ({ping_user})\n"
                  f"{ctx['cleaned_reply']}\n\n"
                  f"### Original Issue Description\n"
                  f"{ctx['issue_body']}\n\n"
                  f"### Complete Issue Comment Thread\n"
                  f"{ctx['comment_thread'][-3500:]}\n\n"
                  f"### Repository Architecture Rules (.agents/AGENTS.md)\n"
                  f"{agents_md}\n\n"
                  f"### Current Workspace Diagnostics\n"
                  f"Recent commits:\n{git_log}\n"
                  f"Clippy output:\n{clippy_out}\n\n"
                  f"IMPORTANT: If anything is ambiguous or requires a design decision from {ping_user}, "
                  f"ask a clear, direct question in English so the workflow can notify {ping_user} in the GitHub Issue."
              )
              create_payload = {
                  "title": f"{session_title_tag} {ctx['issue_title'][:60]}",
                  "prompt": initial_prompt,
                  "sourceContext": {
                      "source": f"sources/github/{ctx['repo_full_name']}",
                      "githubRepoContext": {
                          "startingBranch": DEFAULT_BRANCH
                      }
                  },
                  "requirePlanApproval": False,
                  "automationMode": "AUTO_CREATE_PR"
              }
              try:
                  session_obj = jules_request("POST", "sessions", create_payload)
                  session_name = session_obj.get("name", "")
                  mode_used = f"Created Primary Session (`{session_name}`) for Issue #{issue_num}"
                  prev_cursor = 0
              except urllib.error.HTTPError as he:
                  err_body = he.read().decode("utf-8", errors="replace")
                  with open("/tmp/jules_reply.json", "w", encoding="utf-8") as f:
                      json.dump({
                          "session_name": "",
                          "session_url": "https://jules.google.com",
                          "mode": "API Error",
                          "state": "FAILED",
                          "needs_user_reply": True,
                          "ping_user": ping_user,
                          "question_text": f"Google Jules API returned HTTP {he.code}.",
                          "activity_cursor": 0,
                          "pr_url": "",
                          "issue_url": ctx["issue_url"],
                          "trigger_comment_url": ctx["trigger_comment_url"],
                          "analysis_markdown": f"❌ **Google Jules API Error (HTTP {he.code}):**\n```json\n{err_body[:1000]}\n```"
                      }, f, indent=2)
                  sys.exit(0)

          new_analysis_parts = []
          latest_question = ""
          needs_user_reply = False
          pr_url = ""
          session_state = session_obj.get("state", "RUNNING")
          session_url = session_obj.get("url", "https://jules.google.com")
          new_cursor = prev_cursor

          for poll_idx in range(18):
              time.sleep(10)
              try:
                  session_obj = jules_request("GET", session_name)
                  session_state = session_obj.get("state", session_state)
                  session_url = session_obj.get("url", session_url)

                  for out_item in session_obj.get("outputs", []):
                      pr_obj = out_item.get("pullRequest") or {}
                      if pr_obj.get("url"):
                          pr_url = pr_obj["url"]

                  act_resp = jules_request("GET", f"{session_name}/activities?pageSize=50")
                  activities = act_resp.get("activities", [])
                  new_cursor = len(activities)

                  fresh_activities = activities[prev_cursor:] if len(activities) > prev_cursor else activities[-3:]
                  collected = []
                  detected_question = ""

                  for act in fresh_activities:
                      if "agentMessaged" in act:
                          msg = (act["agentMessaged"].get("agentMessage") or act["agentMessaged"].get("message") or "").strip()
                          if msg:
                              safe_msg = sanitize_outbound_mentions(msg)
                              collected.append(f"**💬 Google Jules Message:**\n{safe_msg}")
                              if "?" in safe_msg or session_state == "AWAITING_USER_FEEDBACK":
                                  detected_question = safe_msg
                      if "planGenerated" in act:
                          plan = act["planGenerated"].get("plan") or {}
                          steps = plan.get("steps") or []
                          if steps:
                              steps_md = "\n".join(
                                  f"{i+1}. **{sanitize_outbound_mentions(st.get('title', 'Step'))}**: {sanitize_outbound_mentions(st.get('description', ''))}"
                                  for i, st in enumerate(steps)
                              )
                              collected.append(f"**📋 Generated Execution Plan:**\n{steps_md}")
                      if "progressUpdated" in act:
                          prog = act["progressUpdated"]
                          ptitle = sanitize_outbound_mentions(prog.get("title") or "")
                          pdesc = sanitize_outbound_mentions(prog.get("description") or "")
                          if ptitle or pdesc:
                              collected.append(f"- 🔄 **{ptitle}**: {pdesc}")

                  if collected:
                      new_analysis_parts = collected

                  if session_state in ("AWAITING_USER_FEEDBACK", "AWAITING_PLAN_APPROVAL") or detected_question:
                      needs_user_reply = True
                      latest_question = detected_question or (
                          "Google Jules has generated an execution plan or reached a decision point and is waiting for your confirmation."
                      )
                      break

                  if session_state in ("COMPLETED", "FAILED", "CANCELLED"):
                      break

                  if len(activities) > prev_cursor and poll_idx >= 5 and any("Message:" in p or "Plan:" in p for p in new_analysis_parts):
                      break
              except Exception as poll_err:
                  print(f"Poll note: {poll_err}")

          if not new_analysis_parts:
              analysis_md = (
                  f"Jules received your instruction and is actively working on **{ctx['issue_title']}** "
                  f"(Current State: `{session_state}`).\n"
                  f"- Live Session Link: {session_url}\n"
                  f"- Reply with `/jules <your message>` at any time to send instructions into `{session_name}` without pinging external GitHub users."
              )
          else:
              analysis_md = "\n\n".join(new_analysis_parts[-6:])

          with open("/tmp/jules_reply.json", "w", encoding="utf-8") as f:
              json.dump({
                  "session_name": session_name,
                  "session_url": session_url,
                  "mode": mode_used,
                  "state": session_state,
                  "needs_user_reply": needs_user_reply,
                  "ping_user": ping_user,
                  "question_text": latest_question,
                  "activity_cursor": new_cursor,
                  "pr_url": pr_url,
                  "issue_url": ctx["issue_url"],
                  "trigger_comment_url": ctx["trigger_comment_url"],
                  "analysis_markdown": analysis_md
              }, f, indent=2)
          EOF

      - name: Post Google Jules Reply and Ping Owner if Question Asked
        if: steps.harvest.outputs.should_run == 'true'
        uses: actions/github-script@v9
        env:
          INPUT_ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
        with:
          script: |
            const fs = require('fs');
            const issueNumber = context.payload.issue
              ? context.payload.issue.number
              : parseInt(process.env.INPUT_ISSUE_NUMBER, 10);

            const reply = JSON.parse(fs.readFileSync('/tmp/jules_reply.json', 'utf8'));
            const prLine = reply.pr_url
              ? `\n- **Generated Pull Request:** ${reply.pr_url}`
              : '';

            let pingBanner = '';
            if (reply.needs_user_reply) {
              pingBanner = [
                `🔔 **Attention @${reply.ping_user} — Google Jules has a question and is waiting for your reply!**`,
                ``,
                `> ❓ **Question / Action Needed from Google Jules:**`,
                `> ${reply.question_text.replace(/\n/g, '\n> ')}`,
                ``,
                `👉 **How to answer safely (without pinging random GitHub users):**`,
                `Simply reply in this issue with \`/jules <your answer>\` and your response will be sent directly into this active session (\`${reply.session_name}\`).`,
                ``,
                `---`,
                ``
              ].join('\n');
            }

            const body = [
              `<!-- jules-session-id: ${reply.session_name} -->`,
              `<!-- jules-activity-cursor: ${reply.activity_cursor} -->`,
              pingBanner,
              `### 🤖 Google Jules Single-Session Update`,
              `- **Session Continuity:** ${reply.mode}`,
              `- **Jules Session State:** \`${reply.state}\``,
              `- **Live Jules Web Session:** [Open Continuous Session in Google Jules](${reply.session_url})`,
              `- **Linked GitHub Issue:** ${reply.issue_url}`,
              `- **Triggered By Comment:** ${reply.trigger_comment_url}${prLine}`,
              ``,
              `---`,
              ``,
              reply.analysis_markdown,
              ``,
              `---`,
              `<details><summary>💬 How to Reply Safely in This Session (Use <code>/jules</code>)</summary>`,
              ``,
              `Write a comment in this issue starting with \`/jules <your answer or instruction>\` (or \`!jules\`).`,
              `Using \`/jules\` instead of \`@jules\` avoids mentioning unrelated GitHub users while forwarding your reply directly to \`POST /v1alpha/${reply.session_name}:sendMessage\`.`,
              `</details>`
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body
            });
