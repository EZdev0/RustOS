name: 🦀 RustOS Master Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # ══════════════════════════════════════════════════════════════
  # BUILD JOB: Compile Kernel & Generate Image
  # ══════════════════════════════════════════════════════════════
  build:
    name: Build RustOS (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🦀 Setup Rust Nightly Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview, clippy
          targets: x86_64-unknown-none

      - name: 📦 Cache Cargo Registry & Build
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-rustos-${{ hashFiles('**/Cargo.toml') }}

      - name: 🧐 Clippy Checks (Deep Testing)
        shell: bash
        continue-on-error: true
        env:
          RUSTC_BOOTSTRAP: 1
        run: |
          echo "Running Cargo Clippy..."
          if ! cargo clippy --bin kernel --target x86_64-unknown-none -- -D warnings 2>&1 | tee clippy-error.log; then
            echo "::warning::Clippy checks failed, but CI will continue to allow AI analysis!"
            cp clippy-error.log build-error.log
            exit 1
          fi

      - name: 🧪 Cargo Test (Deep Testing)
        shell: bash
        continue-on-error: true
        run: |
          echo "Running Cargo Tests..."
          if ! cargo test --bin kernel 2>&1 | tee test-error.log; then
            echo "::warning::Cargo tests failed!"
            cp test-error.log build-error.log
            exit 1
          fi

      - name: 🛠️ Compile RustOS with 3 Retries (Subagent Orchestration)
        shell: bash
        env:
          RUSTC_BOOTSTRAP: 1
        run: |
          set -o pipefail
          echo "════════════════════════════════════════"
          echo "🚀 STARTING BARE-METAL COMPILATION ON ${{ matrix.os }}..."
          echo "════════════════════════════════════════"
          success=0
          for i in 1 2 3; do
            echo "Attempt $i to compile RustOS..."
            if cargo --color never run --bin builder 2>&1 | tee build-error.log; then
              echo "Compilation passed successfully!"
              success=1
              break
            else
              echo "Compilation failed on attempt $i. Retrying in 10s..."
              sleep 10
            fi
          done
          if [ $success -eq 0 ]; then
            echo "Compilation failed after 3 attempts."
            exit 1
          fi

      - name: 🔬 QEMU Integration Test (Headless Boot-Test)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-system-x86
          echo "Starting bare-metal OS in QEMU (Headless Boot-Test)..."
          timeout 10 qemu-system-x86_64 -drive format=raw,file=target/my_rust_os_desktop.img -display none -serial stdio -no-reboot > qemu_output.log 2>&1 || true
          
          echo "--- QEMU OUTPUT ---"
          cat qemu_output.log
          echo "-------------------"
          
          if grep -iqE "panic|triple fault|exception" qemu_output.log; then
            echo "::error::Bootloop or Kernel Panic detected!"
            cp qemu_output.log build-error.log
            exit 1
          fi
          echo "Integration test passed successfully!"
          
      - name: 🤖 Install and Start Ollama (AI Build Analyst)
        if: always() && runner.os == 'Linux'
        run: |
          echo "Installing Ollama for Local AI Debugging..."
          curl -fsSL https://ollama.com/install.sh | command sh
          ollama serve &
          sleep 5
          
          echo "Loading qwen2.5-coder:3b..."
          for i in 1 2 3; do
            if ollama pull qwen2.5-coder:3b; then
              echo "Model loaded!"
              break
            else
              echo "Retrying..."
              sleep 5
            fi
          done

      - name: 🤖 Automated AI Developer (Auto-Fix & Issue) - STRICT READ-ONLY
        if: always() && runner.os == 'Linux'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # EXPLICIT GUARD: The AI must never modify or push code. Strict Read-Only!
          LOG_CONTENT=$(tail -n 60 build-error.log || echo "No errors found.")
          
          if [ "${{ job.status }}" == "success" ]; then
            # Success Report
            PROMPT="You are an expert Rust OS developer. The build SUCCEEDED. Provide a short congratulatory summary and highlight any interesting logs:\n\n$LOG_CONTENT"
            ISSUE_TITLE="✅ AI Report: Build Success (Run ${{ github.run_number }})"
            
            jq -n --arg prompt "$PROMPT" '{"model": "qwen2.5-coder:3b", "prompt": $prompt, "stream": false}' > payload.json
            AI_RESPONSE=$(curl -s -X POST http://localhost:11434/api/generate -d @payload.json | jq -r '.response')
            
            gh issue create --title "$ISSUE_TITLE" \
              --body "## 📊 Build Analysis\n\n**Logs (Tail):**\n\`\`\`rust\n$LOG_CONTENT\n\`\`\`\n\n**🤖 AI Insights:**\n$AI_RESPONSE" || true
          else
            # Failure Fix Suggestion Protocol (Safe Mode)
            echo "Build failed. Initiating AI Safe Fix Suggestion Protocol (Read-Only Mode)..."
            
            # 1. Try to find the file that caused the error
            FAILED_FILE=$(grep -Eo 'kernel/src/[a-zA-Z0-9_/-]+\.rs' build-error.log | head -1)
            
            if [ -n "$FAILED_FILE" ] && [ -f "$FAILED_FILE" ]; then
              echo "Detected failing file: $FAILED_FILE"
              CODE_CONTENT=$(cat "$FAILED_FILE" || echo "")
              
              # NEW SAFE PROMPT: Read-Only, strictly no commits.
              PROMPT="You are an expert Rust systems programmer and AI safety assistant running in READ-ONLY mode in a CI pipeline. The following file failed to compile or test. Analyze the error and suggest a SAFE fix. EXTREMELY IMPORTANT: DO NOT attempt to write files, do not push changes. You are read-only! Provide your suggestions as a detailed explanation with safe code snippets so a human can apply them. Focus on stability and correctness.\n\nError:\n$LOG_CONTENT\n\nFile ($FAILED_FILE):\n$CODE_CONTENT"
              
              jq -n --arg prompt "$PROMPT" '{"model": "qwen2.5-coder:3b", "prompt": $prompt, "stream": false}' > payload.json
              AI_RESPONSE=$(curl -s -X POST http://localhost:11434/api/generate -d @payload.json | jq -r '.response')
              
              echo "Creating GitHub Issue with AI suggestion..."
              
              # Post ONLY as an issue, NO direct code changes, NO PRs
              gh issue create \
                --title "🤖 AI Fix Suggestion: Build/Test Failure in $FAILED_FILE" \
                --body "The CI pipeline encountered an error. I (Ollama AI) analyzed the logs in READ-ONLY mode and suggest a safe fix for a human to review. I make no automatic commits.\n\n### Error Logs:\n\`\`\`rust\n$LOG_CONTENT\n\`\`\`\n\n### 🤖 AI Suggested Fix:\n$AI_RESPONSE" || true
            else
              echo "Could not parse failing file or error is general. Creating standard bug issue..."
              PROMPT="You are an expert Rust systems programmer running in READ-ONLY CI mode. The Rust bare-metal build or tests failed. Analyze the logs and provide a clear fix for a human to apply. DO NOT attempt to change or push code.\n\n$LOG_CONTENT"
              jq -n --arg prompt "$PROMPT" '{"model": "qwen2.5-coder:3b", "prompt": $prompt, "stream": false}' > payload.json
              AI_RESPONSE=$(curl -s -X POST http://localhost:11434/api/generate -d @payload.json | jq -r '.response')
              
              gh issue create --title "❌ AI Bug Report: Build/Test Crash (Run ${{ github.run_number }})" \
                --body "## 📊 Build/Test Analysis\n\n**Logs (Tail):**\n\`\`\`rust\n$LOG_CONTENT\n\`\`\`\n\n**🤖 AI Insights:**\n$AI_RESPONSE\n\n*Note: AI operated in strictly read-only mode.*" || true
            fi
          fi

      - name: 📦 Upload OS Disk Image Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RustOS-Limbo-Image-${{ matrix.os }}
          path: target/my_rust_os_desktop.img
          retention-days: 14

  # ══════════════════════════════════════════════════════════════
  # ANALYSIS JOB: Deep Image Inspection
  # ══════════════════════════════════════════════════════════════
  analysis:
    name: Analyze Image
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Download OS Image
        uses: actions/download-artifact@v4
        with:
          name: RustOS-Limbo-Image-ubuntu-latest
          path: .

      - name: 🕵️ Install Analysis Tools (Binwalk, Fdisk)
        run: |
          sudo apt-get update
          sudo apt-get install -y binwalk fdisk

      - name: 🔬 Deep Image Scan
        run: |
          echo "════════════════════════════════════════"
          echo "🔬 DEEP OS IMAGE ANALYSIS (RustOS)"
          echo "════════════════════════════════════════"
          
          REPORT="rustos-analysis-report.txt"
          echo "=== RUST OS - DISK IMAGE ANALYSIS REPORT ===" > $REPORT
          echo "Date: $(date)" >> $REPORT
          echo "" >> $REPORT

          echo "1. File Size & Type:" >> $REPORT
          ls -lh my_rust_os_desktop.img >> $REPORT
          file my_rust_os_desktop.img >> $REPORT
          echo "" >> $REPORT

          echo "2. Partition Table (fdisk):" >> $REPORT
          fdisk -l my_rust_os_desktop.img >> $REPORT
          echo "" >> $REPORT

          echo "3. Binwalk Signature Scan (Finding Bootloader magic):" >> $REPORT
          binwalk my_rust_os_desktop.img >> $REPORT
          
          echo "Analysis complete. Report generated."
          cat $REPORT

      - name: 📦 Upload Analysis Report
        uses: actions/upload-artifact@v4
        with:
          name: RustOS-Analysis-Report
          path: rustos-analysis-report.txt
          retention-days: 14

  # ══════════════════════════════════════════════════════════════
  # SUMMARY JOB: Final Status Report
  # ══════════════════════════════════════════════════════════════
  summary:
    name: Build Summary
    needs: [ build, analysis ]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: 📊 Workflow Summary
        run: |
          echo ""
          echo "════════════════════════════════════════════════════"
          echo "   ✨ RUST OS BUILD WORKFLOW SUMMARY ✨"
          echo "════════════════════════════════════════════════════"
          echo ""
          echo "📋 Job Status:"
          echo "  • Core Build:    ${{ needs.build.result }}"
          echo "  • Image Analysis:${{ needs.analysis.result }}"
          echo ""

          CRITICAL_OK=true
          [ "${{ needs.build.result }}" = "success" ] && echo "✅ Build PASSED" || { echo "❌ Build FAILED"; CRITICAL_OK=false; }
          [ "${{ needs.analysis.result }}" = "success" ] && echo "✅ Analysis PASSED" || echo "⚠️ Analysis FAILED"

          echo ""
          if $CRITICAL_OK; then
            echo "════════════════════════════════════════════════════"
            echo "✅ ALL CRITICAL JOBS PASSED! 🎉"
            echo "════════════════════════════════════════════════════"
          else
            echo "════════════════════════════════════════════════════"
            echo "⚠️ CHECK FAILED JOBS ABOVE ⚠️"
            echo "════════════════════════════════════════════════════"
            exit 1
          fi

  # ══════════════════════════════════════════════════════════════
  # RELEASE JOB: Auto-Generate Github Release
  # ══════════════════════════════════════════════════════════════
  release:
    name: Generate Release
    needs: [ build, analysis, summary ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: always() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    
    steps:
      - name: 📝 Determine Release Status
        id: status
        run: |
          HAS_FAILURE="${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}"
          if [ "$HAS_FAILURE" = "true" ]; then
            echo "TITLE=❌ RustOS Crash Report (Run ${{ github.run_number }})" >> $GITHUB_ENV
            echo "BODY=## ❌ Critical Build Failure Detected\nThe RustOS pipeline crashed during this run.\n\n**Crash Logs:**\nCheck the attached files or GitHub Actions log." >> $GITHUB_ENV
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          else
            echo "TITLE=✅ RustOS Stable Image Update v1.0.${{ github.run_number }}" >> $GITHUB_ENV
            echo "BODY=## ✅ Automated RustOS Release\nThis release was successfully generated by the smart RustOS Pipeline.\n\n**Included Assets:**\n- \`my_rust_os_desktop.img\` (The bootable hybrid ISO / Disk Image for Limbo & QEMU)\n- \`rustos-analysis-report.txt\` (Binwalk and Fdisk analysis report)" >> $GITHUB_ENV
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          fi

      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
        continue-on-error: true

      - name: 📦 Prepare Release Files
        run: |
          mkdir -p release_assets
          find artifacts/ -type f -exec mv {} release_assets/ \; || true
          echo "Files ready for release:"
          ls -lh release_assets/ || true

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ${{ env.TITLE }}
          body: ${{ env.BODY }}
          files: release_assets/*
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
