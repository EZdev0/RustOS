name: RustOS Multi-Agent PR Security, Tool-Calling & Pre-Verified Suggestions

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CI: 1
  LOCAL_TOOL_MODEL: "qwen2.5-coder:1.5b"
  OLLAMA_HOST: "127.0.0.1:11434"

jobs:
  # ====================================================================
  # AGENT 1: Fetch All PR Context, Security Leaks & Workspace Logs
  # ====================================================================
  agent-1-security-and-leaks:
    name: "Agent 1: PR Harvester, Secret Leaks & Kernel Unsafe Scanner"
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '@rustos-ci') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    outputs:
      leaks_status: ${{ steps.sec_scan.outputs.leaks_status }}
      audit_status: ${{ steps.sec_scan.outputs.audit_status }}
      unsafe_status: ${{ steps.sec_scan.outputs.unsafe_status }}
      clippy_status: ${{ steps.sec_scan.outputs.clippy_status }}
    steps:
      - name: Checkout repository with full git history
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Rust nightly toolchain, components and bare-metal target
        shell: bash
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly
          rustup component add rust-src llvm-tools-preview rustfmt clippy
          rustup target add x86_64-unknown-none

      - name: Cache Cargo registry and build artifacts on Node 24
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rustos-cargo-v5-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            rustos-cargo-v5-

      - name: Run Multi-Layer Security and Kernel Checks
        id: sec_scan
        shell: bash
        run: |
          mkdir -p pr_logs
          # Step 1: Install static Gitleaks v8.30.1 binary
          GITLEAKS_URL="https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -sSL "$GITLEAKS_URL" | tar -xz gitleaks
          chmod +x gitleaks

          if ./gitleaks detect --source . --no-banner --report-format sarif --report-path gitleaks.sarif > pr_logs/gitleaks.log 2>&1; then
            LEAKS_STATUS="✅ 0 Secret Leaks Detected"
          else
            LEAKS_STATUS="❌ Potential Secret Leak Found"
          fi

          # Step 2: Run RustSec Cargo Audit check
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install cargo-audit --locked
          fi
          if cargo audit > pr_logs/cargo_audit.log 2>&1; then
            AUDIT_STATUS="✅ 0 RustSec Vulnerabilities"
          else
            AUDIT_STATUS="⚠️ RustSec Advisory Reported"
          fi

          # Step 3: Audit kernel and builder unsafe blocks
          UNSAFE_CNT=$({ grep -rn "unsafe " kernel/src/ builder/src/ 2>/dev/null || true; } | wc -l | tr -d ' ')
          SAFETY_CNT=$({ grep -rn "// SAFETY:" kernel/src/ builder/src/ 2>/dev/null || true; } | wc -l | tr -d ' ')
          grep -rn "unsafe " kernel/src/ builder/src/ > pr_logs/unsafe_blocks.log 2>&1 || true
          UNSAFE_STATUS="🔍 ${UNSAFE_CNT} unsafe blocks / ${SAFETY_CNT} documented"

          # Step 4: Capture full Clippy and Builder test logs
          if cargo clippy --workspace -- -D warnings > pr_logs/clippy.log 2>&1; then
            CLIPPY_STATUS="✅ 0 Clippy Warnings"
          else
            CLIPPY_STATUS="⚠️ Clippy Findings Captured"
          fi
          cargo test -p builder --release > pr_logs/builder_tests.log 2>&1 || true

          echo "leaks_status<<EOF" >> "$GITHUB_OUTPUT"; echo "${LEAKS_STATUS}" >> "$GITHUB_OUTPUT"; echo "EOF" >> "$GITHUB_OUTPUT"
          echo "audit_status<<EOF" >> "$GITHUB_OUTPUT"; echo "${AUDIT_STATUS}" >> "$GITHUB_OUTPUT"; echo "EOF" >> "$GITHUB_OUTPUT"
          echo "unsafe_status<<EOF" >> "$GITHUB_OUTPUT"; echo "${UNSAFE_STATUS}" >> "$GITHUB_OUTPUT"; echo "EOF" >> "$GITHUB_OUTPUT"
          echo "clippy_status<<EOF" >> "$GITHUB_OUTPUT"; echo "${CLIPPY_STATUS}" >> "$GITHUB_OUTPUT"; echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Upload Gitleaks SARIF report on Node 24
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks.sarif

      - name: Upload all PR Security and Compiler Logs as Artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rustos-pr-security-and-compiler-logs
          path: pr_logs/
          retention-days: 14

  # ====================================================================
  # AGENTS 2, 3 & 4: PR Diff Harvester, Tool-Calling AI, Sandbox & Suggest
  # ====================================================================
  multi-agent-tool-calling-and-verified-suggestions:
    name: "Agents 2-4: Tool-Calling AI, Sandbox Verifier & 1-Click PR Suggestions"
    needs: agent-1-security-and-leaks
    if: >
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '@rustos-ci') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout Pull Request Head Branch on Node 24
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Rust nightly toolchain, components and bare-metal target
        shell: bash
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly
          rustup component add rust-src llvm-tools-preview rustfmt clippy
          rustup target add x86_64-unknown-none

      - name: Restore Cargo cache on Node 24
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rustos-cargo-v5-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            rustos-cargo-v5-

      - name: Fetch All PR Files, Diff Hunks and Commits via GitHub API
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const prNumber = context.payload.pull_request
              ? context.payload.pull_request.number
              : context.payload.issue.number;

            const prData = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            const filesResp = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100
            });

            const prFiles = filesResp.data.map(f => ({
              filename: f.filename,
              status: f.status,
              additions: f.additions,
              deletions: f.deletions,
              patch: f.patch || ''
            }));

            fs.writeFileSync('pr_context.json', JSON.stringify({
              number: prNumber,
              title: prData.data.title,
              body: prData.data.body || '',
              head_sha: prData.data.head.sha,
              base_sha: prData.data.base.sha,
              files: prFiles
            }, null, 2));

      - name: Cache Local Tool-Calling LLM Weights on Node 24
        uses: actions/cache@v6
        with:
          path: ~/.ollama
          key: rustos-local-llm-${{ env.LOCAL_TOOL_MODEL }}-v2

      - name: Start 100% Local Ollama Tool-Calling Engine
        shell: bash
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s "http://${OLLAMA_HOST}/api/tags" >/dev/null; then
              break
            fi
            sleep 1
          done
          ollama pull "${LOCAL_TOOL_MODEL}"

      - name: Run Agent 2 Tool-Calling and Agent 3 Pre-Suggestion Compiler Sandbox
        shell: bash
        run: |
          python3 - << 'EOF'
          import json, os, re, shutil, subprocess, urllib.request

          OLLAMA_URL = f"http://{os.environ.get('OLLAMA_HOST', '127.0.0.1:11434')}/api/chat"
          MODEL = os.environ.get("LOCAL_TOOL_MODEL", "qwen2.5-coder:1.5b")

          def run_cmd(cmd):
              res = subprocess.run(cmd, shell=True, capture_output=True, text=True)
              return res.returncode, res.stdout + res.stderr

          pr_ctx = {"number": 0, "title": "", "files": []}
          if os.path.exists("pr_context.json"):
              with open("pr_context.json", "r", encoding="utf-8") as f:
                  pr_ctx = json.load(f)

          valid_diff_lines = {}
          changed_rs_files = []
          for fobj in pr_ctx.get("files", []):
              fname = fobj.get("filename", "")
              if fname.endswith(".rs") and os.path.exists(fname):
                  changed_rs_files.append(fname)
              patch = fobj.get("patch", "")
              lines_set = set()
              curr_new_line = None
              for pline in patch.splitlines():
                  m = re.match(r"^@@ -\d+(?:,\d+)? \+(\d+)(?:,(\d+))? @@", pline)
                  if m:
                      curr_new_line = int(m.group(1))
                      continue
                  if curr_new_line is not None:
                      if pline.startswith("+") and not pline.startswith("+++"):
                          lines_set.add(curr_new_line)
                          curr_new_line += 1
                      elif not pline.startswith("-") and not pline.startswith("\\"):
                          lines_set.add(curr_new_line)
                          curr_new_line += 1
              if lines_set:
                  valid_diff_lines[fname] = sorted(list(lines_set))

          if not changed_rs_files:
              for fallback in ["kernel/src/main.rs", "builder/src/main.rs"]:
                  if os.path.exists(fallback):
                      changed_rs_files.append(fallback)
                      break

          _, clippy_log = run_cmd("cargo clippy --workspace -- -D warnings")

          # AGENT 3: Pre-Suggestion Compiler & Clippy Sandbox Verifier
          def sandbox_verify_suggestion(path, line_num, replacement_code):
              if not os.path.exists(path):
                  return False, "File does not exist in workspace."
              backup_path = path + ".ci_backup"
              shutil.copyfile(path, backup_path)
              try:
                  with open(path, "r", encoding="utf-8") as f:
                      lines = f.readlines()
                  if line_num < 1 or line_num > len(lines):
                      return False, f"Line {line_num} out of bounds."
                  lines[line_num - 1] = replacement_code.rstrip("\n") + "\n"
                  with open(path, "w", encoding="utf-8") as f:
                      f.writelines(lines)

                  rc_c, out_c = run_cmd("cargo clippy --workspace -- -D warnings")
                  if rc_c != 0:
                      return False, f"Rejected by Agent 3 Compiler Gate:\n{out_c[-350:]}"

                  rc_t, out_t = run_cmd("cargo test -p builder --release")
                  if rc_t != 0:
                      return False, f"Rejected by Agent 3 Test Gate:\n{out_t[-350:]}"

                  return True, "Passed cargo clippy -D warnings and builder unit tests"
              finally:
                  shutil.move(backup_path, path)

          verified_suggestions = []
          rejected_suggestions = []

          for rs_file in changed_rs_files[:5]:
              with open(rs_file, "r", encoding="utf-8") as f:
                  orig_lines = f.readlines()
              run_cmd(f"rustfmt --edition 2021 {rs_file}")
              with open(rs_file, "r", encoding="utf-8") as f:
                  fmt_lines = f.readlines()
              with open(rs_file, "w", encoding="utf-8") as f:
                  f.writelines(orig_lines)

              if orig_lines != fmt_lines and len(orig_lines) == len(fmt_lines):
                  for idx, (o_line, n_line) in enumerate(zip(orig_lines, fmt_lines), 1):
                      if o_line != n_line and idx in valid_diff_lines.get(rs_file, []):
                          ok, reason = sandbox_verify_suggestion(rs_file, idx, n_line.rstrip("\n"))
                          if ok:
                              verified_suggestions.append({
                                  "path": rs_file,
                                  "line": idx,
                                  "in_diff": True,
                                  "replacement_code": n_line.rstrip("\n"),
                                  "explanation": "Standardize Rust formatting and readability according to rustfmt rules.",
                                  "verification": reason
                              })
                              break

          tools = [
              {
                  "type": "function",
                  "function": {
                      "name": "read_pr_file",
                      "description": "Read numbered lines from a Rust file in the Pull Request.",
                      "parameters": {
                          "type": "object",
                          "properties": {
                              "path": {"type": "string"},
                              "start_line": {"type": "integer"},
                              "end_line": {"type": "integer"}
                          },
                          "required": ["path", "start_line", "end_line"]
                      }
                  }
              },
              {
                  "type": "function",
                  "function": {
                      "name": "audit_unsafe_and_bounds",
                      "description": "Scan a Rust file for undocumented unsafe blocks or unwrap calls.",
                      "parameters": {
                          "type": "object",
                          "properties": {
                              "path": {"type": "string"}
                          },
                          "required": ["path"]
                      }
                  }
              },
              {
                  "type": "function",
                  "function": {
                      "name": "propose_verified_suggestion",
                      "description": "Propose a verified Rust code improvement with an English security/quality explanation.",
                      "parameters": {
                          "type": "object",
                          "properties": {
                              "path": {"type": "string"},
                              "line": {"type": "integer"},
                              "replacement_code": {"type": "string"},
                              "explanation": {"type": "string"}
                          },
                          "required": ["path", "line", "replacement_code", "explanation"]
                      }
                  }
              }
          ]

          def execute_local_tool(name, args):
              if name == "read_pr_file":
                  path = args.get("path", "")
                  if not os.path.exists(path):
                      return f"File {path} not found."
                  with open(path, "r", encoding="utf-8", errors="replace") as f:
                      lines = f.readlines()
                  s = max(1, int(args.get("start_line", 1)))
                  e = min(len(lines), int(args.get("end_line", min(len(lines), s + 35))))
                  return "".join(f"{i}: {lines[i-1]}" for i in range(s, e + 1))

              elif name == "audit_unsafe_and_bounds":
                  path = args.get("path", "")
                  if not os.path.exists(path):
                      return f"File {path} not found."
                  with open(path, "r", encoding="utf-8", errors="replace") as f:
                      lines = f.readlines()
                  issues = []
                  for i, l in enumerate(lines, 1):
                      if "unsafe " in l:
                          prev = lines[i - 2] if i >= 2 else ""
                          if "SAFETY:" not in prev and "SAFETY:" not in l:
                              issues.append(f"Line {i}: undocumented unsafe block -> {l.strip()}")
                      if ".unwrap()" in l:
                          issues.append(f"Line {i}: unwrap() may panic in kernel -> {l.strip()}")
                  return "\n".join(issues[:10]) if issues else "0 undocumented unsafe or unwrap calls in file."
              return "Unknown tool."

          def call_ollama(messages):
              payload = json.dumps({
                  "model": MODEL,
                  "messages": messages,
                  "tools": tools,
                  "stream": False,
                  "options": {"temperature": 0.1, "num_predict": 450}
              }).encode("utf-8")
              req = urllib.request.Request(OLLAMA_URL, data=payload, headers={"Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=120) as resp:
                  return json.loads(resp.read().decode("utf-8"))

          def extract_tool_calls(msg):
              calls = msg.get("tool_calls") or []
              if calls:
                  return calls
              content = (msg.get("content") or "").strip()
              m = re.search(r'(\{.*"name"\s*:\s*"[^"]+".*\})', content, re.DOTALL)
              if m:
                  try:
                      parsed = json.loads(m.group(1))
                      if "name" in parsed:
                          return [{"function": {"name": parsed["name"], "arguments": parsed.get("arguments", {})}}]
                  except Exception:
                      pass
              return []

          target_file = changed_rs_files[0] if changed_rs_files else "kernel/src/main.rs"
          diff_lines_for_target = valid_diff_lines.get(target_file, [1])
          start_focus = diff_lines_for_target[0] if diff_lines_for_target else 1
          audit_res = execute_local_tool("audit_unsafe_and_bounds", {"path": target_file})
          snippet_res = execute_local_tool("read_pr_file", {
              "path": target_file,
              "start_line": max(1, start_focus - 5),
              "end_line": start_focus + 30
          })

          messages = [
              {
                  "role": "system",
                  "content": (
                      "You are Agent 2 (RustOS Local Security & Code Quality Inspector). "
                      "All outputs MUST be 100% in English. Use your tools to inspect the PR files, "
                      "detect security leaks, undocumented unsafe blocks, or bounds risks, and propose "
                      "improvements via `propose_verified_suggestion`. Every suggestion is compiled by Agent 3."
                  )
              },
              {
                  "role": "user",
                  "content": (
                      f"PR Title: {pr_ctx.get('title')}\n"
                      f"Target File: `{target_file}` (PR Diff Lines: {diff_lines_for_target[:15]})\n"
                      f"Safety Scan:\n{audit_res}\n\n"
                      f"Code Context:\n{snippet_res}\n\n"
                      f"Clippy Log:\n{clippy_log[-500:]}\n\n"
                      "Use a tool if you want to propose a single-line improvement, then summarize your security review in English."
                  )
              }
          ]

          ai_summary = ""
          for _ in range(3):
              try:
                  resp = call_ollama(messages)
              except Exception as e:
                  ai_summary = f"Local LLM completed static pass ({e})."
                  break

              msg = resp.get("message", {})
              messages.append(msg)
              tcalls = extract_tool_calls(msg)
              if not tcalls:
                  ai_summary = (msg.get("content") or "").strip()
                  break

              for tc in tcalls:
                  fn = tc.get("function", {})
                  tname = fn.get("name", "")
                  targs = fn.get("arguments", {})
                  if isinstance(targs, str):
                      try:
                          targs = json.loads(targs)
                      except Exception:
                          targs = {}

                  if tname == "propose_verified_suggestion":
                      spath = targs.get("path", target_file)
                      sline = int(targs.get("line", start_focus))
                      scode = targs.get("replacement_code", "")
                      sexpl = targs.get("explanation", "Improve kernel safety and code clarity.")
                      ok, reason = sandbox_verify_suggestion(spath, sline, scode)
                      in_diff = sline in valid_diff_lines.get(spath, [])
                      if ok:
                          verified_suggestions.append({
                              "path": spath,
                              "line": sline,
                              "in_diff": in_diff,
                              "replacement_code": scode,
                              "explanation": sexpl,
                              "verification": reason
                          })
                          t_out = f"VERIFIED_PASS: Compiled cleanly ({reason})."
                      else:
                          rejected_suggestions.append({
                              "path": spath,
                              "line": sline,
                              "reason": reason
                          })
                          t_out = f"VERIFICATION_FAILED: {reason}"
                  else:
                      t_out = execute_local_tool(tname, targs)

                  messages.append({"role": "tool", "content": t_out})

          with open("multi_agent_results.json", "w", encoding="utf-8") as out_f:
              json.dump({
                  "pr_number": pr_ctx.get("number"),
                  "pr_files_count": len(pr_ctx.get("files", [])),
                  "target_file": target_file,
                  "audit_findings": audit_res,
                  "verified_suggestions": verified_suggestions,
                  "rejected_suggestions": rejected_suggestions,
                  "ai_summary": ai_summary or "All PR files inspected and verified."
              }, out_f, indent=2)
          EOF

      - name: "Agent 4: Publish Pre-Verified 1-Click Suggestions and Full PR Report"
        uses: actions/github-script@v8
        env:
          LEAKS_STATUS: ${{ needs.agent-1-security-and-leaks.outputs.leaks_status }}
          AUDIT_STATUS: ${{ needs.agent-1-security-and-leaks.outputs.audit_status }}
          UNSAFE_STATUS: ${{ needs.agent-1-security-and-leaks.outputs.unsafe_status }}
          CLIPPY_STATUS: ${{ needs.agent-1-security-and-leaks.outputs.clippy_status }}
        with:
          script: |
            const fs = require('fs');
            const prNumber = context.payload.pull_request
              ? context.payload.pull_request.number
              : context.payload.issue.number;

            let results = {
              pr_files_count: 0,
              target_file: 'kernel/src/main.rs',
              audit_findings: 'None',
              verified_suggestions: [],
              rejected_suggestions: [],
              ai_summary: 'Inspection finished.'
            };
            if (fs.existsSync('multi_agent_results.json')) {
              results = JSON.parse(fs.readFileSync('multi_agent_results.json', 'utf8'));
            }

            const inlineComments = [];
            for (const item of results.verified_suggestions) {
              if (item.in_diff) {
                inlineComments.push({
                  path: item.path,
                  line: item.line,
                  side: 'RIGHT',
                  body: [
                    `### 🛡️ Pre-Verified AI & Compiler Suggestion`,
                    `**Improvement & Security Description:** ${item.explanation}`,
                    `**Agent 3 Sandbox Gate:** ✅ \`${item.verification}\``,
                    ``,
                    '```suggestion',
                    item.replacement_code,
                    '```'
                  ].join('\n')
                });
              }
            }

            if (context.payload.pull_request && inlineComments.length > 0) {
              try {
                await github.rest.pulls.createReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  event: 'COMMENT',
                  comments: inlineComments
                });
              } catch (err) {
                console.log(`Inline review note: ${err.message}`);
              }
            }

            let suggestionsBlock = '';
            if (results.verified_suggestions.length > 0) {
              const itemsMd = results.verified_suggestions.map(s => [
                `- **File:** \`${s.path}\` (Line ${s.line})`,
                `  - **Why:** ${s.explanation}`,
                `  - **Verification:** ✅ \`${s.verification}\``,
                '  ```rust',
                `  ${s.replacement_code}`,
                '  ```'
              ].join('\n')).join('\n');
              suggestionsBlock = `\n#### ✨ Compiler-Verified Code Improvements\n${itemsMd}\n`;
            }

            const body = [
              `### 🛡️ RustOS Multi-Agent PR Security, Tool-Calling & Pre-Verification Report`,
              `Harvested **${results.pr_files_count} changed file(s)** from PR #${prNumber} and executed **100% local tool-calling inference** (\`${process.env.LOCAL_TOOL_MODEL}\`) on \`ubuntu-24.04\` (Node 24 native actions).`,
              ``,
              `| Agent Stage | Check / Gate | Verdict |`,
              `| :--- | :--- | :--- |`,
              `| **Agent 1: SecLeakHunter** | Gitleaks v8.30.1 Secret Scan | ${process.env.LEAKS_STATUS} |`,
              `| **Agent 1: SupplyChainAudit** | \`cargo-audit\` RustSec Scan | ${process.env.AUDIT_STATUS} |`,
              `| **Agent 1: KernelUnsafeAudit** | \`#![no_std]\` \`unsafe\` Invariants | ${process.env.UNSAFE_STATUS} |`,
              `| **Agent 1: CompilerLintGate** | \`cargo clippy -- -D warnings\` | ${process.env.CLIPPY_STATUS} |`,
              `| **Agent 2: ToolCallingInspector** | Local LLM Tool-Calling Pass | ✅ Inspected \`${results.target_file}\` |`,
              `| **Agent 3: SandboxPreVerifier** | Pre-Suggestion Compile Test | ✅ **${results.verified_suggestions.length} Verified** / 🛡️ **${results.rejected_suggestions.length} Blocked** |`,
              `| **Agent 4: GitHubAutoSuggester** | 1-Click PR \`\`\`suggestion\`\`\` Blocks | ✅ Published (${inlineComments.length} inline) |`,
              suggestionsBlock,
              `#### 🧠 Agent 2 Local Tool-Calling Security Review (English)`,
              results.ai_summary,
              ``,
              `<details><summary>🔬 Automated Kernel Safety & Logs Summary (Downloadable in Workflow Artifacts)</summary>`,
              ``,
              '```text',
              results.audit_findings,
              '```',
              `</details>`
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body
            });
