name: RustOS Intelligent ChatOps, Issue Assignment & PR Suggestions

on:
  # 1. Trigger when calling @rustos-ci in any Issue or Pull Request comment
  issue_comment:
    types: [created]

  # 2. Trigger when an Issue is assigned or labeled (e.g., 'ci:assign', 'agent:fix')
  issues:
    types: [assigned, labeled]

  # 3. Trigger on Pull Requests for automatic inline GitHub Code Suggestions & SARIF
  pull_request:
    branches: [main]

  # 4. Manual trigger from Actions tab
  workflow_dispatch:
    inputs:
      command:
        description: "Manual command to execute (check, fix-fmt, build)"
        required: false
        default: "check"

# 2026 Security Standard: Least privilege at top level
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CI: 1

jobs:
  # ============================================================================
  # JOB 1: @rustos-ci Mention & Issue Assignment Controller (ChatOps)
  # ============================================================================
  chatops-and-assignment:
    name: "@rustos-ci Command & Issue Assignment Handler"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Security Guard: Prevent infinite bot loops and unauthorized fork execution
    if: >
      github.actor != 'github-actions[bot]' &&
      !endsWith(github.actor, '[bot]') &&
      (
        github.event_name == 'issues' ||
        (
          github.event_name == 'issue_comment' &&
          contains(github.event.comment.body, '@rustos-ci') &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
        )
      )
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Acknowledge "@rustos-ci" invocation with rocket reaction
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

      - name: Checkout repository (PR branch or default branch)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust nightly toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rust-src, llvm-tools-preview, rustfmt, clippy

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Auto-Branch & Triage on Issue Assignment or "@rustos-ci assign"
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          if [ "$EVENT_NAME" = "issues" ] || echo "$COMMENT_BODY" | grep -qi "@rustos-ci assign"; then
            BRANCH_NAME="feat/issue-${ISSUE_NUMBER}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            if ! git show-ref --verify --quiet "refs/remotes/origin/${BRANCH_NAME}"; then
              git checkout -b "${BRANCH_NAME}"
              git push -u origin "${BRANCH_NAME}"
              echo "CREATED_BRANCH=${BRANCH_NAME}" >> "$GITHUB_ENV"
            else
              echo "CREATED_BRANCH=${BRANCH_NAME} (already exists)" >> "$GITHUB_ENV"
            fi
          fi

      - name: Run Workspace Quality Diagnostics on "@rustos-ci check" or Assignment
        id: diagnostics
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          FMT_STATUS="✅ Passed"
          CLIPPY_STATUS="✅ Passed"
          TEST_STATUS="✅ Passed"

          if ! cargo fmt --all -- --check; then
            FMT_STATUS="❌ Formatting diff detected (run \`@rustos-ci fix-fmt\`)"
          fi

          if ! cargo clippy --workspace -- -D warnings; then
            CLIPPY_STATUS="❌ Clippy warnings detected"
          fi

          if ! cargo test -p builder --release; then
            TEST_STATUS="❌ Host unit tests failed"
          fi

          echo "FMT_STATUS=${FMT_STATUS}" >> "$GITHUB_ENV"
          echo "CLIPPY_STATUS=${CLIPPY_STATUS}" >> "$GITHUB_ENV"
          echo "TEST_STATUS=${TEST_STATUS}" >> "$GITHUB_ENV"

      - name: Auto-Format and Push on "@rustos-ci fix-fmt"
        if: github.event_name == 'issue_comment' && contains(github.event.comment.body, '@rustos-ci fix-fmt')
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cargo fmt --all
          if ! git diff --quiet; then
            TARGET_BRANCH="style/auto-fmt-issue-${ISSUE_NUMBER}"
            git checkout -B "${TARGET_BRANCH}"
            git commit -am "style(workspace): apply rustfmt via @rustos-ci command"
            git push -u origin "${TARGET_BRANCH}" --force
            echo "AUTO_FIX_BRANCH=${TARGET_BRANCH}" >> "$GITHUB_ENV"
          fi

      - name: Post intelligent status report back to Issue / Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const branchInfo = process.env.CREATED_BRANCH
              ? `\n- **Assigned Working Branch**: \`${process.env.CREATED_BRANCH}\` (ready for checkout: \`git fetch && git checkout feat/issue-${issueNumber}\`)`
              : '';
            const autoFixInfo = process.env.AUTO_FIX_BRANCH
              ? `\n- **Auto-Formatted Branch Pushed**: \`${process.env.AUTO_FIX_BRANCH}\``
              : '';

            const body = [
              `### 🤖 RustOS CI Assistant Report (\`@rustos-ci\`)`,
              `Triggered by @${context.actor} via \`${context.eventName}\`.${branchInfo}${autoFixInfo}`,
              ``,
              `| Check Gate | Status |`,
              `| :--- | :--- |`,
              `| **Rustfmt Style Check** | ${process.env.FMT_STATUS || '⏭️ Skipped'} |`,
              `| **Clippy Zero-Warnings** | ${process.env.CLIPPY_STATUS || '⏭️ Skipped'} |`,
              `| **Builder Host Tests** | ${process.env.TEST_STATUS || '⏭️ Skipped'} |`,
              ``,
              `<details><summary>💡 Available <code>@rustos-ci</code> Commands</summary>`,
              ``,
              `- \`@rustos-ci check\` — Run rustfmt, clippy, and host unit tests`,
              `- \`@rustos-ci assign\` — Create dedicated \`feat/issue-${issueNumber}\` branch for this issue`,
              `- \`@rustos-ci fix-fmt\` — Run \`cargo fmt --all\` and push an auto-formatted branch`,
              `</details>`
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body
            });

  # ============================================================================
  # JOB 2: 1-Click GitHub PR Code Suggestions & Inline SARIF Annotations
  # ============================================================================
  pr-suggestions-and-sarif:
    name: PR Inline Code Suggestions & Clippy SARIF
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Install Rust nightly toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rust-src, llvm-tools-preview, rustfmt, clippy

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Run cargo fmt to generate diff for GitHub Suggestions
        run: cargo fmt --all

      - name: Post 1-Click Commit Suggestions to Pull Request
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        uses: reviewdog/action-suggester@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tool_name: rustfmt
          fail_on_error: false

      - name: Reset working tree before Clippy SARIF scan
        run: git checkout -- .

      - name: Install clippy-sarif and sarif-fmt
        run: cargo install clippy-sarif sarif-fmt --locked

      - name: Run Clippy and generate SARIF inline report
        run: |
          cargo clippy --workspace --message-format=json \
            | clippy-sarif \
            | tee rustos-clippy.sarif \
            | sarif-fmt

      - name: Upload Clippy SARIF annotations to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: rustos-clippy.sarif
