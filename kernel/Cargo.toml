[package]
name = "kernel"
version = "0.2.0"
edition = "2021"

[dependencies]
bootloader_api = "0.11.7" # Verwendet das stabile modernisierte Boot-Protokoll
font8x8 = { version = "0.3.1", default-features = false, features = ["unicode"] }
heapless = "0.9.3"
lazy_static = { version = "1.5.0", features = ["spin_no_std"] }
linked_list_allocator = "0.10.5"
pc-keyboard = "0.9.0"
pic8259 = "0.11.0"
spin = "0.9.8"           # Synchronisationsprimitiven für Ring 0
x86_64 = "0.15.4"
