[package]
name = "kernel"
version = "0.2.0"
edition = "2021"



[dependencies]
bootloader_api = "0.11.7" # Verwendet das stabile modernisierte Boot-Protokoll
font8x8 = { version = "0.3.1", default-features = false, features = ["unicode"] }
heapless = { version = "0.9.3", default-features = false }
lazy_static = { version = "1.5.0", features = ["spin_no_std"] }
linked_list_allocator = "0.10.5"
pc-keyboard = "0.9.0"
pic8259 = "0.11.0"
raw-cpuid = "11.0"
spin = "0.9.8"           # Synchronisationsprimitiven für Ring 0
x86_64 = { version = "0.15.4", features = ["instructions"] }
crossbeam-queue = { version = "0.3.11", default-features = false, features = ["alloc"] }
conquer-once = { version = "0.2.0", default-features = false }
futures-util = { version = "0.3.30", default-features = false, features = ["alloc"] }
smoltcp = { version = "0.11.0", default-features = false, features = ["alloc", "log", "medium-ethernet", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp", "socket-icmp", "socket-dhcpv4"] }
bit_field = "0.10.2"
volatile = "0.4.6"
uart_16550 = "0.2.0"
